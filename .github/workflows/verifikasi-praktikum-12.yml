name: Verifikasi ShopEase di macOS Intel
on:
  push:
    branches: [verifikasi-praktikum-12]
    paths:
      - '.github/workflows/verifikasi-praktikum-12.yml'
permissions:
  contents: read
jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Tugas/Tugas Pertemuan 12
    env:
      PBKK12_TEST_RUN: '1'
      PBKK12_TEST_URL: http://127.0.0.1:8080
      CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v4
      - name: Uji Chrome dan SQLite pada macOS x86_64
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          sed 's@http://localhost:8080/@http://127.0.0.1:8080/@' shopease/env.sqlite > shopease/.env
          bash scripts/setup.sh sqlite
          export PBKK12_TEST_DSN="sqlite:$PWD/shopease/writable/db_shopease.sqlite"
          npm --prefix tests install --ignore-scripts --no-audit --no-fund
          (cd shopease && php spark serve --host 127.0.0.1 --port 8080) > /tmp/shopease-server.log 2>&1 &
          for n in $(seq 1 30); do if curl -fsS http://127.0.0.1:8080/login > /dev/null; then break; fi; sleep 1; done
          node tests/capture.mjs || { tail -60 /tmp/shopease-server.log; exit 1; }
          node -e "const v=require('./docs/verifikasi.json'); console.log('PBKK12_MAC_RESULT '+JSON.stringify({os:v.os, time:v.time, php:v.php, browser:v.browser, sqlite:v.before.version, checks:v.checks.length, captures:v.captures.length}));"
